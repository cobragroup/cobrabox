minimum_pre_commit_version: "4.5.0"

repos:
- repo: local
  hooks:
    - id: gen-feature-stubs
      name: generate feature stubs
      entry: uv run python scripts/gen_stubs.py
      language: system
      pass_filenames: false
      # `src/cobrabox/features/` was removed by the #107 catalog restructure, so this
      # hook had stopped matching anything. Features now live in domain packages
      # directly under src/cobrabox/.
      files: ^src/cobrabox/.*\.py$

    - id: gen-feature-docstrings
      name: sync functional docstrings
      entry: uv run python scripts/gen_functional_docstrings.py
      language: system
      pass_filenames: false
      files: ^src/cobrabox/.*\.py$

    - id: ty-check
      name: ty check
      entry: uv run ty check src
      language: system
      pass_filenames: false

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.16
  hooks:
    # ruff linter - on par with `uvx ruff check`
    - id: ruff-check
    # ruff formatter - on par with `uvx ruff format`
    - id: ruff-format
